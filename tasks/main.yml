---
- name: Manage OS-specific dependencies.
  ansible.builtin.include_tasks: "dependencies_{{ ansible_facts['os_family'] }}.yml"

- name: Download the ruby source into /usr/local/src if not yet present for version {{ ruby_version }}
  ansible.builtin.get_url:
    url: https://cache.ruby-lang.org/pub/ruby/{{ ruby_major_minor }}/ruby-{{ ruby_version }}.tar.{{ ruby_source_extension }}
    dest: /usr/local/src/ruby-{{ ruby_version }}.tar.{{ ruby_source_extension }}
    checksum: "{{ ruby_version_checksum }}"
    mode: '0644'

- name: Upload the ruby install script
  ansible.builtin.template:
    src: ruby-install.j2
    dest: /usr/local/src/ruby-{{ ruby_version }}-install.sh
    owner: root
    group: root
    mode: '0755'

- name: Configure gems so that docs are not generated
  ansible.builtin.copy:
    src: gemrc
    dest: /etc/gemrc
    owner: root
    group: root
    mode: '0644'

- name: Install ruby from source version {{ ruby_version }}
  ansible.builtin.command:
    cmd: /usr/local/src/ruby-{{ ruby_version }}-install.sh
    creates: /usr/local/src/ruby-{{ ruby_version }}/ruby
  become: true

# RubyGems 4 (Ruby 4.0) needs community.general >= 13.0.0, earlier versions call the removed `gem query`
- name: Install bundler gem version {{ ruby_bundler_version }}
  community.general.gem:
    name: bundler
    user_install: false
    version: "{{ ruby_bundler_version }}"
    executable: /usr/local/bin/gem

# The gem module can only install the rubygems-update gem, `gem update --system` also runs it
- name: Update rubygems to the latest version
  ansible.builtin.command:
    cmd: /usr/local/bin/gem update --system
  register: ruby_rubygems_update
  changed_when: "'Latest version already installed' not in ruby_rubygems_update.stdout"
